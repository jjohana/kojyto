(function () {
  const dataElement = document.getElementById("gamification-data");
  if (!dataElement) {
    return;
  }
  let config = {};
  try {
    config = JSON.parse(dataElement.textContent || "{}");
  } catch (error) {
    return;
  }
  const quizzes = Array.isArray(config.quizzes) ? config.quizzes : [];
  const rules = config.rules || {};
  const storageKey = config.storage_key || "kojyto:gamification";
  const legacyStorageKeys = Array.isArray(config.legacy_storage_keys)
    ? config.legacy_storage_keys.filter(function (key) { return key && key !== storageKey; })
    : [];
  const levelXp = Number(rules.level_xp || 500);
  const bonuses = Array.isArray(rules.score_bonuses) ? rules.score_bonuses : [];
  const medals = Array.isArray(rules.medals) ? rules.medals : [];

  function emptyState() {
    return { completed: {} };
  }

  function normalizeState(parsed) {
    if (!parsed || typeof parsed !== "object") {
      return emptyState();
    }
    if (!parsed.completed || typeof parsed.completed !== "object") {
      parsed.completed = {};
    }
    return parsed;
  }

  function loadStateForKey(key) {
    try {
      const raw = window.localStorage.getItem(key);
      const parsed = raw ? JSON.parse(raw) : {};
      return normalizeState(parsed);
    } catch (error) {
      return emptyState();
    }
  }

  function saveState(state) {
    try {
      window.localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (error) {
      // localStorage may be disabled; the quiz still works without persisted rewards.
    }
  }

  function mergeCompleted(target, source) {
    const targetCompleted = target.completed || {};
    const sourceCompleted = (source && source.completed) || {};
    let changed = false;
    Object.keys(sourceCompleted).forEach(function (quizId) {
      const incoming = sourceCompleted[quizId];
      if (!incoming || typeof incoming !== "object") {
        return;
      }
      const previous = targetCompleted[quizId] || {};
      const previousBest = Number(previous.best_score || previous.score || 0);
      const incomingBest = Number(incoming.best_score || incoming.score || 0);
      if (!targetCompleted[quizId] || incomingBest > previousBest) {
        targetCompleted[quizId] = {
          score: Number(incoming.score || incomingBest || 0),
          best_score: Math.max(previousBest, incomingBest),
          completed_at: previous.completed_at || incoming.completed_at || new Date().toISOString(),
        };
        changed = true;
      }
    });
    target.completed = targetCompleted;
    return changed;
  }

  function loadState() {
    const state = loadStateForKey(storageKey);
    let migrated = false;
    legacyStorageKeys.forEach(function (legacyKey) {
      migrated = mergeCompleted(state, loadStateForKey(legacyKey)) || migrated;
    });
    if (migrated) {
      saveState(state);
    }
    return state;
  }

  function scoreBonusXp(score) {
    const value = Number(score);
    if (!Number.isFinite(value)) {
      return 0;
    }
    return bonuses.reduce(function (total, bonus) {
      const threshold = Number(bonus.threshold || 0);
      const xp = Number(bonus.xp || 0);
      return value >= threshold ? total + xp : total;
    }, 0);
  }

  function quizById(quizId) {
    return quizzes.find(function (quiz) {
      return quiz.quiz_id === quizId;
    });
  }

  function quizXp(quiz, score) {
    return Number(quiz && quiz.base_xp ? quiz.base_xp : 0) + scoreBonusXp(score);
  }

  function medalTargetCount(medal, total) {
    const threshold = Number(medal && medal.threshold_percent ? medal.threshold_percent : 0);
    if (!total || threshold <= 0) {
      return 0;
    }
    return Math.max(1, Math.ceil((threshold / 100) * total));
  }

  function qcmCountLabel(count) {
    return String(Math.max(0, Number(count) || 0)) + " QCM";
  }

  function summarize(state) {
    const completed = state.completed || {};
    let completedCount = 0;
    let xp = 0;
    quizzes.forEach(function (quiz) {
      const record = completed[quiz.quiz_id];
      if (!record) {
        return;
      }
      completedCount += 1;
      xp += quizXp(quiz, Number(record.best_score || record.score || 0));
    });
    const total = quizzes.length;
    const percent = total ? Math.round((completedCount / total) * 100) : 0;
    const level = 1 + Math.floor(Math.max(0, xp) / levelXp);
    let currentMedal = { key: "none", label: "Aucune médaille", threshold_percent: 0 };
    let nextMedal = null;
    medals.forEach(function (medal) {
      const threshold = Number(medal.threshold_percent || 0);
      if (percent >= threshold) {
        currentMedal = medal;
      } else if (!nextMedal) {
        nextMedal = medal;
      }
    });
    const nextMedalTarget = nextMedal ? medalTargetCount(nextMedal, total) : total;
    const nextMedalRemaining = nextMedal ? Math.max(0, nextMedalTarget - completedCount) : 0;
    const currentMedalLabel = currentMedal && currentMedal.key && currentMedal.key !== "none" ? currentMedal.label : "";
    const medalLabel = nextMedal
      ? (currentMedalLabel || (nextMedal.label + " dans " + qcmCountLabel(nextMedalRemaining)))
      : "Médaille Or obtenue";
    const nextMedalText = nextMedal
      ? "Prochaine : " + nextMedal.label + " dans " + qcmCountLabel(nextMedalRemaining)
      : "Parcours complet";
    return {
      completed: completed,
      completedCount: completedCount,
      total: total,
      percent: percent,
      xp: xp,
      level: level,
      currentMedal: currentMedal,
      nextMedal: nextMedal,
      nextMedalTarget: nextMedalTarget,
      nextMedalRemaining: nextMedalRemaining,
      medalLabel: medalLabel,
      nextMedalText: nextMedalText,
    };
  }

  function setText(selector, value) {
    document.querySelectorAll(selector).forEach(function (element) {
      element.textContent = value;
    });
  }

  function renderGamification() {
    const summary = summarize(loadState());
    setText("[data-gamification-percent]", summary.percent + "%");
    setText("[data-gamification-count]", summary.completedCount + "/" + summary.total);
    setText("[data-gamification-xp]", summary.xp + " XP");
    setText("[data-gamification-level]", "Niveau " + summary.level);
    setText("[data-gamification-medal]", summary.medalLabel || "Aucune médaille");
    setText("[data-gamification-next]", summary.nextMedalText || "Parcours complet");
    document.querySelectorAll("[data-gamification-bar]").forEach(function (element) {
      element.style.width = summary.percent + "%";
    });
    document.querySelectorAll("[data-quiz-id]").forEach(function (element) {
      const quizId = element.getAttribute("data-quiz-id");
      const done = !!summary.completed[quizId];
      element.classList.toggle("quiz-completed", done);
      element.setAttribute("data-quiz-completed", done ? "1" : "0");
    });
    return summary;
  }

  function markQuizCompleted(quizId, score) {
    const quiz = quizById(quizId);
    if (!quiz) {
      return renderGamification();
    }
    const numericScore = Number(score || 0);
    const state = loadState();
    const previous = state.completed[quizId] || {};
    const previousBest = Number(previous.best_score || previous.score || 0);
    state.completed[quizId] = {
      score: Number.isFinite(numericScore) ? numericScore : 0,
      best_score: Math.max(previousBest, Number.isFinite(numericScore) ? numericScore : 0),
      completed_at: previous.completed_at || new Date().toISOString(),
    };
    saveState(state);
    return renderGamification();
  }

  window.KOJYTO_GAMIFICATION = {
    markQuizCompleted: markQuizCompleted,
    quizXp: function (quizId, score) {
      return quizXp(quizById(quizId), score);
    },
    render: renderGamification,
    summary: function () {
      return summarize(loadState());
    },
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderGamification);
  } else {
    renderGamification();
  }
  window.addEventListener("storage", function (event) {
    if (event.key === storageKey) {
      renderGamification();
    }
  });
}());
