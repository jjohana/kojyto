(function () {
  const dataElement = document.getElementById("gamification-data");
  if (!dataElement) {
    return;
  }
  let config = {};
  try {
    config = JSON.parse(dataElement.textContent || "{}");
  } catch (error) {
    return;
  }
  const quizzes = Array.isArray(config.quizzes) ? config.quizzes : [];
  const rules = config.rules || {};
  const storageKey = config.storage_key || "kojyto:gamification";
  const levelXp = Number(rules.level_xp || 500);
  const bonuses = Array.isArray(rules.score_bonuses) ? rules.score_bonuses : [];
  const medals = Array.isArray(rules.medals) ? rules.medals : [];

  function loadState() {
    try {
      const raw = window.localStorage.getItem(storageKey);
      const parsed = raw ? JSON.parse(raw) : {};
      if (!parsed || typeof parsed !== "object") {
        return { completed: {} };
      }
      if (!parsed.completed || typeof parsed.completed !== "object") {
        parsed.completed = {};
      }
      return parsed;
    } catch (error) {
      return { completed: {} };
    }
  }

  function saveState(state) {
    try {
      window.localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (error) {
      // localStorage may be disabled; the quiz still works without persisted rewards.
    }
  }

  function scoreBonusXp(score) {
    const value = Number(score);
    if (!Number.isFinite(value)) {
      return 0;
    }
    return bonuses.reduce(function (total, bonus) {
      const threshold = Number(bonus.threshold || 0);
      const xp = Number(bonus.xp || 0);
      return value >= threshold ? total + xp : total;
    }, 0);
  }

  function quizById(quizId) {
    return quizzes.find(function (quiz) {
      return quiz.quiz_id === quizId;
    });
  }

  function quizXp(quiz, score) {
    return Number(quiz && quiz.base_xp ? quiz.base_xp : 0) + scoreBonusXp(score);
  }

  function summarize(state) {
    const completed = state.completed || {};
    let completedCount = 0;
    let xp = 0;
    quizzes.forEach(function (quiz) {
      const record = completed[quiz.quiz_id];
      if (!record) {
        return;
      }
      completedCount += 1;
      xp += quizXp(quiz, Number(record.best_score || record.score || 0));
    });
    const total = quizzes.length;
    const percent = total ? Math.round((completedCount / total) * 100) : 0;
    const level = 1 + Math.floor(Math.max(0, xp) / levelXp);
    let currentMedal = { label: "Aucune médaille", threshold_percent: 0 };
    let nextMedal = null;
    medals.forEach(function (medal) {
      const threshold = Number(medal.threshold_percent || 0);
      if (percent >= threshold) {
        currentMedal = medal;
      } else if (!nextMedal) {
        nextMedal = medal;
      }
    });
    return {
      completed: completed,
      completedCount: completedCount,
      total: total,
      percent: percent,
      xp: xp,
      level: level,
      currentMedal: currentMedal,
      nextMedal: nextMedal,
    };
  }

  function setText(selector, value) {
    document.querySelectorAll(selector).forEach(function (element) {
      element.textContent = value;
    });
  }

  function renderGamification() {
    const summary = summarize(loadState());
    setText("[data-gamification-percent]", summary.percent + "%");
    setText("[data-gamification-count]", summary.completedCount + "/" + summary.total + " QCM");
    setText("[data-gamification-xp]", summary.xp + " XP");
    setText("[data-gamification-level]", "Niveau " + summary.level);
    setText("[data-gamification-medal]", summary.currentMedal.label || "Aucune médaille");
    setText(
      "[data-gamification-next]",
      summary.nextMedal ? "Prochaine : " + summary.nextMedal.label : "Parcours complet"
    );
    document.querySelectorAll("[data-gamification-bar]").forEach(function (element) {
      element.style.width = summary.percent + "%";
    });
    document.querySelectorAll("[data-quiz-id]").forEach(function (element) {
      const quizId = element.getAttribute("data-quiz-id");
      const done = !!summary.completed[quizId];
      element.classList.toggle("quiz-completed", done);
      element.setAttribute("data-quiz-completed", done ? "1" : "0");
    });
    return summary;
  }

  function markQuizCompleted(quizId, score) {
    const quiz = quizById(quizId);
    if (!quiz) {
      return renderGamification();
    }
    const numericScore = Number(score || 0);
    const state = loadState();
    const previous = state.completed[quizId] || {};
    const previousBest = Number(previous.best_score || previous.score || 0);
    state.completed[quizId] = {
      score: Number.isFinite(numericScore) ? numericScore : 0,
      best_score: Math.max(previousBest, Number.isFinite(numericScore) ? numericScore : 0),
      completed_at: previous.completed_at || new Date().toISOString(),
    };
    saveState(state);
    return renderGamification();
  }

  window.KOJYTO_GAMIFICATION = {
    markQuizCompleted: markQuizCompleted,
    quizXp: function (quizId, score) {
      return quizXp(quizById(quizId), score);
    },
    render: renderGamification,
    summary: function () {
      return summarize(loadState());
    },
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderGamification);
  } else {
    renderGamification();
  }
  window.addEventListener("storage", function (event) {
    if (event.key === storageKey) {
      renderGamification();
    }
  });
}());
</script></body></html>
